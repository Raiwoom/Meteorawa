<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meteorawa</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; --text-muted: #888888; --card-bg: rgba(255, 255, 255, 0.05); --card-border: rgba(255, 255, 255, 0.1); --icon-color: #cccccc; --green: #00ff00; --red: #ff3333; --bg-image: none; --card-radius: 32px; --forecast-bg: rgba(0, 0, 0, 0.4); }
        body.light-theme { --bg-color: #f5f5f5; --text-color: #000000; --text-muted: #666666; --card-bg: rgba(255, 255, 255, 0.7); --card-border: rgba(0, 0, 0, 0.08); --icon-color: #333333; --green: #008800; --bg-image: none; --card-radius: 32px; --forecast-bg: rgba(255, 255, 255, 0.6); }
        body.pencil-theme { --bg-color: #fcfbf7; --text-color: #2c2c2c; --text-muted: #6a6a6a; --card-bg: transparent; --card-border: #4a4a4a; --icon-color: #2c2c2c; --green: #4a7c59; --card-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; --forecast-bg: rgba(252, 251, 247, 0.95); --bg-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"); font-family: 'Caveat', 'Comic Sans MS', cursive; }
        body.pencil-theme * { font-family: 'Caveat', 'Comic Sans MS', cursive !important; }
        body.pencil-theme .weather-icon, body.pencil-theme .fc-icon, body.pencil-theme .hourly-icon { filter: grayscale(100%) contrast(150%) sepia(10%); text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        body.pencil-theme .status-dot { background-color: var(--green); box-shadow: 1px 1px 0px rgba(0,0,0,0.2), inset -1px -1px 0px rgba(255,255,255,0.5); border: 1px solid var(--text-color); }
        body.pencil-theme .status-dot.yellow { background-color: #d4a373; border-color: #b5835a; }
        body.pencil-theme .status-dot.red { background-color: #a44a3f; border-color: #7a2e2e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); background-image: var(--bg-image); background-attachment: fixed; color: var(--text-color); transition: all 0.3s; height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .header { display: flex; align-items: center; padding: 20px; position: absolute; top: 0; width: 100%; z-index: 10; padding-top: max(20px, env(safe-area-inset-top)); }
        .logo { font-size: 32px; font-weight: bold; color: var(--green); margin-right: 10px; letter-spacing: 1px; }
        body.pencil-theme .logo { text-shadow: 1px 1px 1px rgba(0,0,0,0.2); font-size: 36px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 10px var(--green); transition: all 0.3s; }
        .status-dot.yellow { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .status-dot.red { background-color: var(--red); box-shadow: 0 0 10px var(--red); }
        .header-actions { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; font-size: 20px; color: var(--icon-color); user-select: none; }
        .icon-btn:active { background: rgba(128, 128, 128, 0.2); }
        body.pencil-theme .icon-btn { border: 2px solid var(--card-border); border-radius: 48% 52% 45% 55% / 55% 45% 52% 48%; box-shadow: 2px 2px 0px rgba(0,0,0,0.15); }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; padding-top: 80px; overflow-y: auto; }
        .weather-card { background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--card-border); border-radius: var(--card-radius); padding: 30px 40px; width: 100%; max-width: 350px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); text-align: center; transition: all 0.3s ease; position: relative; }
        body.pencil-theme .weather-card { border: 2px solid var(--card-border); box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.15), -1px -1px 0px rgba(0,0,0,0.05); background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 4px); }
        .card-loc-btn, .card-help-btn { position: absolute; top: 15px; width: 35px; height: 35px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--icon-color); z-index: 5; }
        .card-loc-btn { right: 15px; font-size: 16px; }
        .card-help-btn { left: 15px; font-size: 18px; font-weight: bold; }
        body.pencil-theme .card-loc-btn, body.pencil-theme .card-help-btn { border: 2px dashed var(--card-border); background: transparent; border-radius: 50% 45% 55% 48% / 45% 50% 48% 55%; }
        .location { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; padding: 0 20px; }
        body.pencil-theme .location { font-size: 24px; font-weight: bold; }
        .temperature { font-size: 96px; font-weight: 700; line-height: 1; margin-bottom: 5px; color: var(--text-color); }
        body.pencil-theme .temperature { font-size: 120px; }
        .condition { font-size: 18px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--text-color); }
        body.pencil-theme .condition { font-size: 26px; }
        .weather-icon { font-size: 32px; }
        .details { display: flex; justify-content: space-between; border-top: 1px solid var(--card-border); padding-top: 20px; font-size: 14px; color: var(--text-muted); }
        body.pencil-theme .details { border-top: 2px dashed var(--card-border); font-size: 20px; }
        .detail-item span { display: block; color: var(--text-color); font-weight: bold; font-size: 16px; margin-top: 5px; }
        body.pencil-theme .detail-item span { font-size: 26px; }
        .retry-btn { display: none; margin: 15px auto 0; background: var(--red); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .forecast-panel { background: var(--forecast-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--card-border); padding: 15px 0; width: 100%; flex-shrink: 0; padding-bottom: max(15px, env(safe-area-inset-bottom)); }
        body.pencil-theme .forecast-panel { border-top: 2px dashed var(--card-border); }
        .forecast-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: 0 20px 10px 20px; font-weight: bold; }
        body.pencil-theme .forecast-title { font-size: 20px; text-transform: none; }
        .forecast-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 0 20px 10px 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .forecast-scroll::-webkit-scrollbar { display: none; }
        .forecast-item { flex: 0 0 auto; width: 75px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 12px 0; text-align: center; cursor: pointer; position: relative; }
        body.pencil-theme .forecast-item { border: 1.5px solid var(--card-border); border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .fc-day { font-size: 12px; color: var(--text-muted); text-transform: capitalize; margin-bottom: 2px; }
        body.pencil-theme .fc-day { font-size: 18px; }
        .fc-date { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        body.pencil-theme .fc-date { font-size: 20px; }
        .fc-icon { font-size: 24px; margin-bottom: 6px; }
        body.pencil-theme .fc-icon { font-size: 30px; }
        .fc-temp { font-size: 16px; font-weight: bold; }
        body.pencil-theme .fc-temp { font-size: 22px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .settings-card { background-color: var(--bg-color); border: 1px solid var(--card-border); border-radius: 24px; width: 90%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-height: 85vh; overflow-y: auto; }
        body.pencil-theme .settings-card { border: 2px solid var(--card-border); border-radius: var(--card-radius); }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 20px; color: var(--text-color); }
        body.pencil-theme .card-header h2 { font-size: 28px; }
        .close-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-color); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .search-input { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-size: 16px; outline: none; }
        .search-results { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
        .search-result-item { background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        .search-result-item .country { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .save-btn { background-color: var(--red); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; opacity: 0; pointer-events: none; }
        .save-btn.active { opacity: 1; pointer-events: auto; }
        .theme-toggle-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 15px; border-radius: 12px; text-align: left; cursor: pointer; width: 100%; display: flex; flex-direction: column; }
        .theme-toggle-btn .title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .theme-toggle-btn .subtitle { font-size: 12px; color: var(--text-muted); }
        .theme-list { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
        .theme-list.active { display: flex; }
        .theme-item { background: var(--card-bg); padding: 15px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .theme-item.selected { border: 1px solid var(--text-color); }
        .theme-item .text .title { font-size: 16px; font-weight: 500; color: var(--text-color); }
        .theme-item .text .subtitle { font-size: 12px; color: var(--text-muted); }
        .theme-item .check { color: var(--green); font-size: 24px; visibility: hidden; }
        .theme-item.selected .check { visibility: visible; }
        .loading-text { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 10px; }
        .detail-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--card-border); }
        .detail-row span { color: var(--text-muted); font-size: 14px; }
        .detail-row b { color: var(--text-color); font-size: 16px; }
        .hourly-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: none; }
        .hourly-item { flex: 0 0 auto; width: 60px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 8px 0; text-align: center; }
        .hourly-time { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .hourly-icon { font-size: 18px; margin-bottom: 4px; }
        .hourly-temp { font-size: 13px; font-weight: bold; }
        .feedback-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .feedback-btn.yes { background-color: #00ff00; color: #000; }
        .feedback-btn.no { background-color: #ff3333; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Meteorawa</div>
        <div class="status-dot" id="statusDot"></div>
        <div class="header-actions">
            <div class="icon-btn" onclick="openSearch()">🔎</div>
            <div class="icon-btn" onclick="openSettings()"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></div>
        </div>
    </div>
    <div class="main-content">
        <div class="weather-card">
            <div class="card-help-btn" onclick="openFeedback()">?</div>
            <div class="card-loc-btn" onclick="getUserLocation()">📳</div>
            <div class="location" id="currentLocation">...</div>
            <div class="temperature" id="mainTemp">--°C</div>
            <div class="condition"><span class="weather-icon" id="weatherIcon">⏳</span><span class="weather-desc" id="weatherDesc">...</span></div>
            <div class="details">
                <div class="detail-item">Влажность <span id="humidity">--%</span></div>
                <div class="detail-item">Ветер <span id="windSpeed">--</span></div>
            </div>
            <button class="retry-btn" id="retryBtn" onclick="retryFetch()">Повторить</button>
        </div>
    </div>
    <div class="forecast-panel">
        <div class="forecast-title">Прогноз на 15 дней</div>
        <div class="forecast-scroll" id="forecastScroll"><div class="loading-text" style="width:100%; text-align:center; padding: 20px;">...</div></div>
    </div>
    <div class="modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
        <div class="settings-card" onclick="event.stopPropagation()">
            <div class="card-header"><h2 id="detailDate">...</h2><button class="close-btn" onclick="closeDetailModal(event)">X</button></div>
            <div style="text-align: center; margin: 5px 0;"><div style="font-size: 50px;" id="detailIcon">☀️</div><div style="font-size: 16px; font-weight: bold;" id="detailDesc">...</div></div>
            <div class="detail-grid">
                <div class="detail-row"><span>Макс. темп.</span> <b id="detailMax">--°C</b></div>
                <div class="detail-row"><span>Мин. темп.</span> <b id="detailMin">--°C</b></div>
                <div class="detail-row"><span>Осадки</span> <b id="detailPrecip">-- мм</b></div>
            </div>
            <div style="margin-top: 10px; border-top: 1px solid var(--card-border); padding-top: 10px;">
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">ПОЧАСОВОЙ ПРОГНОЗ</div>
                <div class="hourly-scroll" id="hourlyForecastScroll"></div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="searchModal">
        <div class="settings-card">
            <div class="card-header"><h2>Поиск города</h2><button class="close-btn" onclick="closeSearch()">X</button></div>
            <input type="text" id="searchInput" class="search-input" placeholder="Введите город..." oninput="handleSearchInput()">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
    <div class="modal-overlay" id="feedbackModal" onclick="closeFeedback(event)">
        <div class="settings-card" onclick="event.stopPropagation()">
            <div class="card-header"><h2>Обратная связь</h2><button class="close-btn" onclick="closeFeedback(event)">X</button></div>
            <div style="text-align: center; margin: 15px 0; font-size: 20px;">Верный ли прогноз?</div>
            <div style="display: flex; gap: 15px;"><button class="feedback-btn no" onclick="submitFeedback(false)">Нет</button><button class="feedback-btn yes" onclick="submitFeedback(true)">Да</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-card">
            <div class="card-header"><h2>Настройки</h2><div style="display: flex; gap: 10px;"><button class="save-btn" id="saveBtn" onclick="saveSettings()">Сохранить</button><button class="close-btn" onclick="closeSettings()">X</button></div></div>
            <button class="theme-toggle-btn" onclick="toggleList('themeList')"><div class="title">Темы</div><div class="subtitle">настройки тем</div></button>
            <div class="theme-list" id="themeList">
                <div class="theme-item" id="theme-light" onclick="selectTheme('light')"><div class="text"><div class="title">Белая</div></div><div class="check">•</div></div>
                <div class="theme-item" id="theme-dark" onclick="selectTheme('dark')"><div class="text"><div class="title">Черная</div></div><div class="check">•</div></div>
                <div class="theme-item" id="theme-pencil" onclick="selectTheme('pencil')"><div class="text"><div class="title">Карандаш</div></div><div class="check">•</div></div>
            </div>
        </div>
    </div>

    <script>
        // === ВСТАВЬТЕ СЮДА ВАШ КЛЮЧ ОТ VISUALCROSSING.COM ===
        // Регистрация: visualcrossing.com/weather-api -> Sign Up (1 минута)
        const VC_KEY = 'ВСТАВЬТЕ_СЮДА_ВАШ_КЛЮЧ';

        let currentLat = 55.7558, currentLon = 37.6173, currentCity = "Москва";
        let lastWeatherData = null;

        function getVCWeatherIcon(icon) {
            if (!icon) return '☁️';
            if (icon.includes('clear-day')) return '☀️';
            if (icon.includes('clear-night')) return '🌙';
            if (icon.includes('partly-cloudy-day')) return '🌤️';
            if (icon.includes('partly-cloudy-night')) return '☁️';
            if (icon.includes('cloudy')) return '☁️';
            if (icon.includes('rain')) return '🌧️';
            if (icon.includes('snow')) return '🌨️';
            if (icon.includes('fog')) return '🌫️';
            if (icon.includes('thunder')) return '⛈️';
            return '☁️';
        }

        function openSearch() { document.getElementById('searchModal').classList.add('active'); document.getElementById('searchInput').focus(); }
        function closeSearch() { document.getElementById('searchModal').classList.remove('active'); document.getElementById('searchResults').innerHTML = ''; document.getElementById('searchInput').value = ''; }
        function openFeedback() { document.getElementById('feedbackModal').classList.add('active'); }
        function closeFeedback(e) { if (e) e.stopPropagation(); document.getElementById('feedbackModal').classList.remove('active'); }
        function submitFeedback(yes) { alert(yes ? "Отлично! Спасибо за отзыв." : "Спасибо, мы постараемся улучшить прогнозы!"); closeFeedback(); }
        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
        function toggleList(id) { document.getElementById(id).classList.toggle('active'); }
        function selectTheme(t) { document.querySelectorAll('.theme-item').forEach(el => el.classList.remove('selected')); document.getElementById('theme-' + t).classList.add('selected'); document.getElementById('saveBtn').classList.add('active'); window._theme = t; }
        function saveSettings() { document.body.classList.remove('light-theme', 'pencil-theme'); if (window._theme === 'light') document.body.classList.add('light-theme'); else if (window._theme === 'pencil') document.body.classList.add('pencil-theme'); closeSettings(); }
        function closeDetailModal(e) { if (e) e.stopPropagation(); document.getElementById('detailModal').classList.remove('active'); }

        function getUserLocation() {
            if (!navigator.geolocation) { alert("Геолокация не поддерживается"); return; }
            document.getElementById('currentLocation').innerText = 'Определение...';
            navigator.geolocation.getCurrentPosition(
                (pos) => { currentLat = pos.coords.latitude; currentLon = pos.coords.longitude; currentCity = "Мое местоположение"; fetchWeather(); },
                () => { alert("Не удалось определить местоположение"); fetchWeather(); },
                { timeout: 10000 }
            );
        }

        let searchTimeout;
        function handleSearchInput() {
            clearTimeout(searchTimeout);
            const q = document.getElementById('searchInput').value.trim();
            const c = document.getElementById('searchResults');
            if (q.length < 3) { c.innerHTML = ''; return; }
            c.innerHTML = '<div class="loading-text">Поиск...</div>';
            searchTimeout = setTimeout(() => {
                fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=ru&format=json`)
                    .then(r => r.json())
                    .then(data => {
                        c.innerHTML = '';
                        if (!data.results) { c.innerHTML = '<div class="loading-text">Не найдено</div>'; return; }
                        data.results.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'search-result-item';
                            div.innerHTML = `<div class="title">${item.name}</div><div class="country">${item.country || ''}</div>`;
                            div.onclick = () => { closeSearch(); currentLat = item.latitude; currentLon = item.longitude; currentCity = item.name; fetchWeather(); };
                            c.appendChild(div);
                        });
                    });
            }, 600);
        }

        async function fetchWeather() {
            document.getElementById('currentLocation').innerText = currentCity;
            document.getElementById('mainTemp').innerText = '...';
            document.getElementById('weatherDesc').innerText = 'Загрузка...';
            document.getElementById('weatherIcon').innerText = '⏳';
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('forecastScroll').innerHTML = '<div class="loading-text" style="width:100%;text-align:center;padding:20px;">Загрузка...</div>';

            try {
                const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${currentLat},${currentLon}?unitGroup=metric&include=current,days&key=${VC_KEY}&contentType=json&lang=ru`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}. Проверьте ключ Visual Crossing.`);
                lastWeatherData = await res.json();
                renderWeather();
            } catch (err) {
                console.error(err);
                document.getElementById('mainTemp').innerText = '--°C';
                document.getElementById('weatherDesc').innerText = "Ошибка";
                document.getElementById('weatherIcon').innerText = '⚠️';
                document.getElementById('retryBtn').style.display = 'block';
                document.getElementById('forecastScroll').innerHTML = `<div class="loading-text" style="color:var(--red)">${err.message}</div>`;
            }
        }

        function retryFetch() { fetchWeather(); }

        function renderWeather() {
            const cur = lastWeatherData.currentConditions;
            const days = lastWeatherData.days;

            document.getElementById('mainTemp').innerText = `${Math.round(cur.temp)}°C`;
            document.getElementById('humidity').innerText = `${cur.humidity}%`;
            document.getElementById('windSpeed').innerText = `${Math.round(cur.windspeed / 3.6)} м/с`;
            document.getElementById('weatherIcon').innerText = getVCWeatherIcon(cur.icon);
            document.getElementById('weatherDesc').innerText = cur.conditions;

            const scroll = document.getElementById('forecastScroll');
            scroll.innerHTML = '';
            const todayStr = new Date().toISOString().split('T')[0];

            days.forEach((day, idx) => {
                const dateObj = new Date(day.datetime + 'T12:00:00');
                const dayName = day.datetime === todayStr ? 'Сегодня' : dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });
                const dayNum = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

                const div = document.createElement('div');
                div.className = 'forecast-item';
                div.onclick = () => showDayDetail(idx);
                div.innerHTML = `
                    <div class="fc-day">${dayName}</div>
                    <div class="fc-date">${dayNum}</div>
                    <div class="fc-icon">${getVCWeatherIcon(day.icon)}</div>
                    <div class="fc-temp">${Math.round(day.tempmax)}°C</div>
                `;
                scroll.appendChild(div);
            });
        }

        function showDayDetail(idx) {
            const day = lastWeatherData.days[idx];
            const dateObj = new Date(day.datetime + 'T12:00:00');
            const todayStr = new Date().toISOString().split('T')[0];
            const dateString = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

            document.getElementById('detailDate').innerText = day.datetime === todayStr ? 'Сегодня, ' + dateString : dateString;
            document.getElementById('detailIcon').innerText = getVCWeatherIcon(day.icon);
            document.getElementById('detailDesc').innerText = day.conditions;
            document.getElementById('detailMax').innerText = `${Math.round(day.tempmax)}°C`;
            document.getElementById('detailMin').innerText = `${Math.round(day.tempmin)}°C`;
            document.getElementById('detailPrecip').innerText = `${day.precip || 0} мм`;

            const hourly = document.getElementById('hourlyForecastScroll');
            hourly.innerHTML = '';
            const currentHour = new Date().getHours();

            if (day.hours) {
                day.hours.forEach(h => {
                    const hHour = parseInt(h.datetime.split(':')[0]);
                    if (day.datetime === todayStr && hHour < currentHour) return;
                    if (hHour % 3 !== 0) return;

                    const hDiv = document.createElement('div');
                    hDiv.className = 'hourly-item';
                    hDiv.innerHTML = `
                        <div class="hourly-time">${h.datetime.substring(0, 5)}</div>
                        <div class="hourly-icon">${getVCWeatherIcon(h.icon)}</div>
                        <div class="hourly-temp">${Math.round(h.temp)}°C</div>
                    `;
                    hourly.appendChild(hDiv);
                });
            }
            document.getElementById('detailModal').classList.add('active');
        }

        window.onload = () => fetchWeather();
    </script>
</body>
</html>
